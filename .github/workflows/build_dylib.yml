
name: Build Kwar Nu Booster Dylib

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile iOS Dynamic Library
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Source File
        run: |
          set -e
          test -f KwarNuBooster.m
          echo "Source file found."

      - name: Compile Dylib
        run: |
          set -euo pipefail

          SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "Using iOS SDK: $SDKPATH"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios12.0 \
            -isysroot "$SDKPATH" \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -o KwarNuBooster.dylib \
            KwarNuBooster.m

          test -f KwarNuBooster.dylib
          echo "Build completed."

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KwarNuBooster-dylib
          path: KwarNuBooster.dylib
          if-no-files-found: error

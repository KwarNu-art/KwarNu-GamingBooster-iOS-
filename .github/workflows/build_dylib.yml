name: Build Kwar Nu Booster Dylib
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Verify Source File
        run: |
          ls -la
          test -f KwarNuBooster.m || (echo "Error: KwarNuBooster.m not found!" && exit 1)
      - name: Compile Dylib
        run: xcrun -sdk iphoneos clang -dynamiclib -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -arch arm64 -arch arm64e -framework Foundation -framework UIKit -framework QuartzCore -fobjc-arc -O3 -o KwarNuBooster.dylib KwarNuBooster.m
      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KwarNuBooster-dylib
          path: KwarNuBooster.dylib

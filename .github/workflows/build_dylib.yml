name: Build Kwar Nu Booster Dylib  
  
on:  
  push:  
    branches: [ main, master ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: macos-latest  
  
    steps:  
      - name: Checkout Source Code  
        uses: actions/checkout@v4  
  
      - name: Verify Source File  
        run: |  
          if [ ! -f "KwarNuBooster.m" ]; then  
            echo "Error: KwarNuBooster.m file not found in root directory!"  
            ls -la  
            exit 1  
          fi  
  
      - name: Compile Dylib  
        run: |  
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)  
          xcrun -sdk iphoneos clang -dynamiclib \  
            -isysroot "$SDK_PATH" \  
            -arch arm64 \  
            -arch arm64e \  
            -framework Foundation \  
            -framework UIKit \  
            -framework QuartzCore \  
            -fobjc-arc \  
            -O3 \  
            -o KwarNuBooster.dylib \  
            KwarNuBooster.m  
  
      - name: Upload Dylib Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: KwarNuBooster-dylib  
          path: KwarNuBooster.dylib

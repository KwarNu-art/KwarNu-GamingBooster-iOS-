name: Build Kwar Nu Gaming Booster

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS ARM64 Dylib
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Source File
        shell: bash
        run: |
          set -euo pipefail
          test -f KwarNuBooster.m
          echo "Source file found."

      - name: Show Xcode and SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile Dylib
        shell: bash
        run: |
          set -euo pipefail

          SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios12.0 \
            -isysroot "$SDKPATH" \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -install_name @rpath/KwarNuBooster.dylib \
            KwarNuBooster.m \
            -o KwarNuBooster.dylib

          test -s KwarNuBooster.dylib
          echo "Dylib compilation succeeded."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KwarNuBooster-dylib
          path: KwarNuBooster.dylib
          if-no-files-found: error
